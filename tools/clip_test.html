<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<title>LARI.js — clipping test</title>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  } }
</script>
<style>body { font: 13px/1.4 ui-monospace, monospace; background: #111; color: #ddd; padding: 16px; } .bad { color: #ff8a7a; } .ok { color: #7ae0a8; }</style>
</head>
<body>
<p>Clipping test: arms (and hands) vs head, hair, scarf, ears, beak and torso, for every character × pose × emote (+ every hat).</p>
<pre id="out">running…</pre>
<script type="module">
// Poses every rig through the same targets the game uses and checks whether arm vertices end up inside
// the head/hair/torso/hat volumes (each approximated by the ellipsoid inscribed in its local bounding box).
import * as THREE from 'three';
import { loadAll, byName } from './js/assets.js?v=7';
import { Rig, CHAR_META, EMOTES, EMOTE_TIME } from './js/actors.js?v=7';
import { SHOP } from './js/save.js?v=7';

const out = document.getElementById('out');
const LIMIT = +(new URLSearchParams(location.search).get('limit') || 0.06);   // how deep (0…1 of the volume) counts as clipping
await loadAll();
const scene = new THREE.Scene();
const v = new THREE.Vector3(), M = new THREE.Matrix4();

function volumes(root, minSize) {
  const list = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.computeBoundingBox();
    const bb = o.geometry.boundingBox, s = bb.getSize(new THREE.Vector3());
    if (Math.min(s.x, s.y, s.z) < minSize) return;                 // skip eyes, lashes, buttons, whiskers…
    list.push({ mesh: o, name: o.name, c: bb.getCenter(new THREE.Vector3()), h: s.multiplyScalar(0.5 * 0.92) });
  });
  return list;
}
function inside(mover, vol) {
  const pos = mover.geometry.attributes.position;
  M.copy(vol.mesh.matrixWorld).invert().multiply(mover.matrixWorld);
  let n = 0, worst = 0;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).applyMatrix4(M);
    const dx = (v.x - vol.c.x) / vol.h.x, dy = (v.y - vol.c.y) / vol.h.y, dz = (v.z - vol.c.z) / vol.h.z;
    const d = dx * dx + dy * dy + dz * dz;
    if (d < 1) { n++; worst = Math.max(worst, 1 - Math.sqrt(d)); }
  }
  return { n, worst };
}
const body = (o) => Object.assign({ vx: 0, vy: 0, onGround: true, facing: 1, gliding: false, sliding: false, pound: 0, poundHang: 0, dash: 0, landed: false, jumped: null, x: 0, y: 0, wallDir: 1 }, o);
const PLAY = {
  idle: body({}), runA: body({ vx: 7 }), runB: body({ vx: 7 }), jumpUp: body({ onGround: false, vy: 8 }), fall: body({ onGround: false, vy: -6 }),
  glide: body({ onGround: false, vy: -2, gliding: true }), wallSlide: body({ onGround: false, vy: -3, sliding: true }),
  pound: body({ onGround: false, vy: -20, pound: 1, poundHang: 0 }), dash: body({ onGround: false, dash: 0.1, vx: 17 }),
};

function check(charId, hatId) {
  const rig = new Rig(charId, hatId, null, scene);
  scene.add(rig.root);
  const head = rig.parts.head, torso = byName(rig.model, 'Body');
  const hat = hatId !== 'none' ? volumes(rig.model.getObjectByName(`Hat_${hatId}`) || new THREE.Group(), 0.03) : [];
  const solids = [...volumes(head, 0.1), ...(torso ? [volumes(torso, 0.2).find(x => x.mesh === torso)].filter(Boolean) : []), ...hat];
  const movers = []; for (const a of [rig.parts.armL, rig.parts.armR]) a?.traverse(o => o.isMesh && movers.push(o));
  const hits = [];
  const test = (pose) => {
    rig.root.updateMatrixWorld(true);
    for (const m of movers) for (const s of solids) {
      const r = inside(m, s);
      if (r.n > 1 && r.worst > LIMIT) hits.push({ pose, arm: m.name, into: s.name, n: r.n, depth: +r.worst.toFixed(2) });
    }
  };
  // menu idle + every emote, frame by frame
  for (const t of [0.3, 1.1, 2.2]) { rig.emoteName = null; rig.update(0.5, t, null, 'menu'); test(`menu t${t}`); }
  for (const name of Object.keys(EMOTES)) {
    const dur = EMOTE_TIME[name] || 1.6;
    for (let p = 0.02; p < 1; p += 0.06) for (const t of [0.4, 1.3]) {
      rig.emoteName = name; rig.emoteT = p * dur - 0.5;
      rig.update(0.5, t + p, null, 'menu'); test(`${name} p${p.toFixed(2)}`);
    }
  }
  // in-game poses
  for (const [name, b] of Object.entries(PLAY)) for (const t of [0.2, 0.7, 1.2]) {
    rig.emoteName = null; rig.phase = t * 9;
    rig.update(0.5, t, b, 'play'); test(`play:${name}`);
  }
  scene.remove(rig.root); rig.dispose();
  // collapse: worst hit per (pose family, arm side, part)
  const worst = new Map();
  for (const h of hits) {
    const k = `${h.pose.split(' ')[0]} · ${h.arm.replace(/Mesh|\d+$/g, '')} → ${h.into}`;
    if (!worst.has(k) || worst.get(k).depth < h.depth) worst.set(k, h);
  }
  return [...worst.entries()].map(([k, h]) => `${k} (${h.n} verts, depth ${h.depth})`);
}

const lines = []; const report = {};
for (const c of SHOP.characters) {
  const res = check(c.id, 'none');
  report[c.id] = res;
  lines.push(`${res.length ? '✗' : '✓'} ${c.id.padEnd(10)} ${res.length ? '\n    ' + res.join('\n    ') : ''}`);
}
for (const h of SHOP.hats.filter(h => h.id !== 'none')) for (const c of ['coder', 'siti', 'puteri', 'kancil', 'kenyalang', 'robot']) {
  const res = check(c, h.id).filter(r => r.includes(`Hat`) || /Terendak|Teng|Cup|Petal|Ear|Crown|Cone|Cap|Songkok|Band|Point|Pom|Pistil/.test(r));
  if (res.length) { report[`${c}+${h.id}`] = res; lines.push(`✗ ${c}+${h.id}\n    ${res.join('\n    ')}`); }
}
// hats against the bits of a head that stick out (ears, buns, tiara, antenna, casque…) — a hat must not swallow them
const FEATURES = /Ear|Bun|Tiara|Antenna|Casque|HairBack|Horn|Bow/;
for (const c of SHOP.characters) for (const h of SHOP.hats.filter(h => h.id !== 'none')) {
  const rig = new Rig(c.id, h.id, null, scene); scene.add(rig.root);
  rig.update(0.5, 0.3, null, 'menu'); rig.root.updateMatrixWorld(true);
  const hatRoot = rig.model.getObjectByName(`Hat_${h.id}`);
  const inHat = new Set(); hatRoot?.traverse(o => inHat.add(o));
  const feats = []; rig.parts.head.traverse(o => { if (o.isMesh && o.visible && FEATURES.test(o.name) && !inHat.has(o)) feats.push(o); });
  const hatVols = hatRoot ? volumes(hatRoot, 0.03) : [];
  const res = [];
  for (const f of feats) for (const hv of hatVols) { const r = inside(f, hv); if (r.n > 2 && r.worst > 0.1) res.push(`${f.name} inside ${hv.name} (${r.n} verts, depth ${r.worst.toFixed(2)})`); }
  for (const hm of hatVols) for (const f of volumes(rig.parts.head, 0.05).filter(v => FEATURES.test(v.name) && v.mesh.visible && !inHat.has(v.mesh))) { const r = inside(hm.mesh, f); if (r.n > 2 && r.worst > 0.1) res.push(`${hm.name} inside ${f.name} (${r.n} verts, depth ${r.worst.toFixed(2)})`); }
  if (res.length) lines.push(`✗ hat ${h.id} on ${c.id}\n    ${[...new Set(res)].join('\n    ')}`);
  scene.remove(rig.root); rig.dispose();
}
out.innerHTML = lines.map(l => `<span class="${l.startsWith('✓') ? 'ok' : 'bad'}">${l.replace(/</g, '&lt;')}</span>`).join('\n');
window.__clip = report;
document.title = 'done';
</script>
</body>
</html>
